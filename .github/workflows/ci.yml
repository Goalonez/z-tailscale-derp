name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tailscale_version: ${{ steps.version.outputs.tailscale_version }}
      tailscale_revision: ${{ steps.version.outputs.tailscale_revision }}
      go_version: ${{ steps.version.outputs.go_version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: 检查脚本语法
        run: for script in scripts/*.sh; do bash -n "$script"; done
      - name: 解析上游稳定版
        id: version
        run: bash scripts/resolve-version.sh >> "$GITHUB_OUTPUT"

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        if: matrix.arch == 'arm64'
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: 构建镜像
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: z-tailscale-derp:test
          build-args: |
            TAILSCALE_VERSION=${{ needs.check.outputs.tailscale_version }}
            TAILSCALE_REVISION=${{ needs.check.outputs.tailscale_revision }}
            GO_VERSION=${{ needs.check.outputs.go_version }}
            BUILD_REVISION=${{ github.sha }}
            SOURCE_URL=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=derper-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=derper-${{ matrix.arch }}
      - name: 检查镜像版本
        env:
          VERSION: ${{ needs.check.outputs.tailscale_version }}
          PLATFORM: linux/${{ matrix.arch }}
        run: |
          actual="$(docker run --rm --platform "$PLATFORM" z-tailscale-derp:test --version)"
          case "$actual" in
            "$VERSION"|"$VERSION"-*) printf '%s\n' "$actual" ;;
            *) echo "版本不匹配：$actual" >&2; exit 1 ;;
          esac
